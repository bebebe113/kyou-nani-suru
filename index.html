<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きょうなにする？スロット</title>
<style>
  :root {
    --bg: #fff8f2; --card: #ffffff; --text: #2b2330; --muted: #7a6f80;
    --accent: #ff6b6b; --accent2: #845ef7; --border: #f0e4da;
    --machine: #2b2330; --reel: #fffdf8; --row: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a22; --card: #29252f; --text: #f3eef6; --muted: #a79fb0; --border: #3a3442; --machine: #3a3442; --reel: #fffdf8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .label { font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 10px 6px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: .95rem; cursor: pointer; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---- スロット ---- */
  .machine { background: var(--machine); border-radius: 22px; padding: 14px; margin-bottom: 16px;
    box-shadow: 0 8px 0 rgba(0,0,0,.15); }
  .machine .top { display: flex; justify-content: space-between; align-items: center; color: #ffd43b;
    font-weight: bold; font-size: .85rem; padding: 0 4px 10px; letter-spacing: .1em; }
  .lamps { display: flex; gap: 6px; }
  .lamps i { width: 10px; height: 10px; border-radius: 50%; background: #ffd43b; opacity: .35; }
  .machine.spinning .lamps i { animation: blink .3s infinite alternate; }
  .machine.spinning .lamps i:nth-child(2) { animation-delay: .1s; }
  .machine.spinning .lamps i:nth-child(3) { animation-delay: .2s; }
  .window { position: relative; height: calc(var(--row) * 5); overflow: hidden; border-radius: 12px; background: var(--reel); }
  .window::before, .window::after { content: ""; position: absolute; left: 0; right: 0; height: calc(var(--row) * 2);
    z-index: 2; pointer-events: none; }
  .window::before { top: 0; background: linear-gradient(var(--reel) 5%, rgba(255,253,248,.4)); }
  .window::after { bottom: 0; background: linear-gradient(rgba(255,253,248,.4), var(--reel) 95%); }
  .hit { position: absolute; top: calc(var(--row) * 2); left: 0; right: 0; height: var(--row); z-index: 3;
    border-top: 3px solid var(--accent); border-bottom: 3px solid var(--accent); pointer-events: none; }
  .hit::before, .hit::after { content: ""; position: absolute; top: 50%; transform: translateY(-50%);
    border: 10px solid transparent; }
  .hit::before { left: 0; border-left-color: var(--accent); }
  .hit::after { right: 0; border-right-color: var(--accent); }
  .strip { will-change: transform; }
  .strip.blur { filter: blur(1.2px); }
  .item { height: var(--row); display: flex; align-items: center; gap: 10px; padding: 0 28px;
    color: #2b2330; font-weight: bold; font-size: 1rem; line-height: 1.25; }
  .item .e { font-size: 1.6rem; flex: 0 0 auto; }
  .count { text-align: right; color: var(--muted); font-size: .75rem; padding: 8px 4px 0; }

  .spin { display: block; width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 #c94f6d; transition: transform .08s, box-shadow .08s; }
  .spin:active { transform: translateY(4px); box-shadow: 0 1px 0 #c94f6d; }
  .spin:disabled { opacity: .5; cursor: default; }
  .result { text-align: center; display: none; margin-top: 16px; }
  .result.show { display: block; animation: pop .4s ease; }
  .result .emoji { font-size: 3rem; }
  .result .name { font-size: 1.3rem; font-weight: bold; margin: 4px 0 12px; }
  .result .by { color: var(--muted); font-size: .85rem; margin: -6px 0 12px; }
  .result .by:empty { display: none; }
  .row { display: flex; gap: 8px; }
  .row button, .row input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .95rem; }
  .row button { cursor: pointer; }
  .post { display: block; text-align: center; padding: 12px; border-radius: 12px; border: 2px dashed var(--accent);
    color: var(--accent); font-weight: bold; text-decoration: none; }
  .post:hover { background: var(--bg); }
  .note { color: var(--muted); font-size: .8rem; margin: 8px 0 0; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); font-size: .85rem; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 0 0 4px; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes blink { to { opacity: 1; } }
  @media (max-width: 380px) { .item { font-size: .9rem; padding: 0 22px; } }
</style>

// ---- フォロワー投稿（Googleフォーム → スプレッドシート → CSVで公開）----
// スプレッドシートの「ファイル > 共有 > ウェブに公開 > CSV」で出たURLを入れる。空なら読み込まない
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTzGRYc6DuxFqpOurcA8vcnOTJj-71SaoGyHs9f3tNwVetBMuambSs9LhNqThaVgK7j0B81NYN78gCl/pub?output=csv";
// 列名（フォームの質問名と、運営が手で追加する「承認」列）
const COL = { name: "やること", emoji: "絵文字", who: "だれ向け", by: "ニックネーム", ok: "承認" };
const SEED_NAME = "初期データ"; // 運営が入れた行のニックネーム（結果画面にクレジットを出さない）
const WHO_MAP = { "ひとり": "solo", "ふたり": "couple", "どちらでも": "both" };
let remote = [];

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function loadRemote() {
  if (!SHEET_CSV_URL) return;
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    const [head, ...rows] = parseCSV(await res.text());
    const idx = Object.fromEntries(Object.entries(COL).map(([k, v]) => [k, head.indexOf(v)]));
    remote = rows
      .filter(r => (r[idx.ok] || "").trim().toUpperCase() === "TRUE" && r[idx.name]?.trim())
      .map(r => ({
        name: r[idx.name].trim().slice(0, 24),
        emoji: (r[idx.emoji] || "").trim() || "💡",
        who: WHO_MAP[(r[idx.who] || "").trim()] || "both",
        by: (r[idx.by] || "").trim().slice(0, 16),
      }));
    idle();
  } catch (e) { console.warn("フォロワー投稿の読み込みに失敗", e); }
}

const ROW = 64;         // 1行の高さ(px)：CSSの --row と合わせる
const SPIN_ROWS = 40;    // 1回のスピンで流れる行数
const SPIN_MS = 3800;

let who = "solo";
let custom = load();
let current = null;
let spinning = false;

const $ = (id) => document.getElementById(id);
const strip = $("strip");

function load() { try { return JSON.parse(localStorage.getItem("custom") || "[]"); } catch { return []; } }
function save() { try { localStorage.setItem("custom", JSON.stringify(custom)); } catch {} }

function candidates() {
  const mine = custom.map(name => ({ name, emoji: "⭐" }));
  const base = remote.length ? remote : ACTIVITIES;
  return [...mine, ...base.filter(a => a.who === "both" || a.who === who)];
}
const pick = (list) => list[Math.floor(Math.random() * list.length)];

function itemEl(a) {
  const d = document.createElement("div"); d.className = "item";
  const e = document.createElement("span"); e.className = "e"; e.textContent = a.emoji;
  const n = document.createElement("span"); n.textContent = a.name;
  d.append(e, n); return d;
}

// stripの中身を描画し、centerIdx番目が当たり枠（上から3行目）に来る位置に置く
function render(items, centerIdx) {
  strip.replaceChildren(...items.map(itemEl));
  strip.style.transition = "none";
  strip.style.transform = `translateY(${-(centerIdx - 2) * ROW}px)`;
}

function idle() {
  const list = candidates();
  current = current && list.some(a => a.name === current.name) ? current : pick(list);
  render([pick(list), pick(list), current, pick(list), pick(list)], 2);
  $("count").textContent = `候補 ${list.length} 件`;
}

function spin() {
  if (spinning) return;
  const list = candidates();
  spinning = true; $("spin").disabled = true; $("result").classList.remove("show");
  $("machine").classList.add("spinning");

  // [上2行, 現在, ...流れる行..., 当たり, 下2行]
  const target = pick(list);
  const items = [pick(list), pick(list), current];
  for (let i = 0; i < SPIN_ROWS; i++) items.push(pick(list));
  const targetIdx = items.length;
  items.push(target, pick(list), pick(list));
  render(items, 2);

  strip.offsetHeight; // reflow して開始位置を確定
  strip.classList.add("blur");
  strip.style.transition = `transform ${SPIN_MS}ms cubic-bezier(.12,.75,.18,1.02)`;
  strip.style.transform = `translateY(${-(targetIdx - 2) * ROW}px)`;
  setTimeout(() => strip.classList.remove("blur"), SPIN_MS * .7);

  strip.addEventListener("transitionend", () => {
    spinning = false; current = target;
    $("spin").disabled = false; $("machine").classList.remove("spinning");
    render(items.slice(targetIdx - 2, targetIdx + 3), 2);
    $("rEmoji").textContent = target.emoji;
    $("rName").textContent = target.name;
    $("rBy").textContent = target.by && target.by !== SEED_NAME ? `💡 ${target.by} さんの提案` : "";
    $("result").classList.add("show");
    $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, { once: true });
}

function renderChips() {
  $("chips").replaceChildren(...custom.map((name, i) => {
    const el = document.createElement("span"); el.className = "chip"; el.textContent = "⭐ " + name;
    const x = document.createElement("button"); x.textContent = "×"; x.ariaLabel = "削除";
    x.onclick = () => { custom.splice(i, 1); save(); renderChips(); idle(); };
    el.appendChild(x); return el;
  }));
}

$("who").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || spinning) return;
  $("who").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  who = b.dataset.v; idle();
});
$("spin").onclick = spin;
$("again").onclick = spin;
$("share").onclick = async () => {
  const text = `今日は「${$("rName").textContent}」に決定！ #きょうなにする`;
  if (navigator.share) { try { await navigator.share({ text }); } catch {} }
  else { try { await navigator.clipboard.writeText(text); alert("コピーしました"); } catch {} }
};
$("addBtn").onclick = () => {
  const v = $("customInput").value.trim();
  if (!v || custom.includes(v)) return;
  custom.push(v); save(); $("customInput").value = ""; renderChips(); idle();
};
$("customInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) $("addBtn").click(); });

renderChips(); idle(); loadRemote();
</script>
</body>
</html>
